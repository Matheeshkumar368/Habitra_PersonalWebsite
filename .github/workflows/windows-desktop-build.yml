name: Build Windows Desktop App (NSIS & Portable)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build & Package Habitra for Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies via npm
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --prefer-offline --no-audit
            if ($LASTEXITCODE -ne 0) {
              Write-Host "npm ci fallback to npm install..."
              npm install --no-audit
            }
          } else {
            npm install --no-audit
          }

      - name: Generate Windows ICO and PNG icons
        run: npm run icons:generate

      - name: Run TypeScript type & lint check
        run: npm run lint

      - name: Build production frontend bundle (dist/)
        run: npm run build

      - name: Verify production dist/ assets
        shell: pwsh
        run: |
          $required = @(
            "dist/index.html",
            "dist/icon.ico",
            "dist/icon.png",
            "dist/icon.svg",
            "dist/music/manifest.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing required production build file: $file"
              exit 1
            }
          }
          Write-Host "All required dist/ assets verified."

      - name: Package Windows x64 NSIS Installer & Portable Executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Verify generated Windows x64 executables & print SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "Artifact: $($_.Name) | Size: $sizeMB MB | SHA256: $hash"
          }
          $setupFiles = Get-ChildItem -Path release -Filter "Habitra-Setup-*-x64.exe"
          $portableFiles = Get-ChildItem -Path release -Filter "Habitra-Portable-*-x64.exe"
          if ($setupFiles.Count -eq 0) {
            Write-Error "NSIS Setup installer executable was not generated in release/!"
            exit 1
          }
          if ($portableFiles.Count -eq 0) {
            Write-Error "Portable executable was not generated in release/!"
            exit 1
          }

      - name: Upload Windows NSIS Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitra-Windows-x64-Setup-Installer
          path: release/Habitra-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Habitra-Windows-x64-Portable
          path: release/Habitra-Portable-*-x64.exe
          if-no-files-found: error
          retention-days: 30
